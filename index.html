<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>アンブレラ</title>
<style>
:root{--bg:#0d1020;--fg:#fff;--accent:#ffd34d;--btn:#ff5d8f;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","Noto Sans JP",sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
canvas{display:block;background:#161b33;border-radius:8px}
.ov{position:absolute;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;background:rgba(8,10,25,.72);padding:24px;border-radius:8px}
.ov.show{display:flex}
.ov h1{margin:0;font-size:34px;letter-spacing:.1em}
.ov p{margin:0;line-height:1.7;font-size:15px;opacity:.9}
.ov .big{font-size:44px;font-weight:700;color:var(--accent)}
button{font:inherit;font-size:20px;font-weight:700;color:#fff;background:var(--btn);border:0;border-radius:999px;padding:14px 34px;cursor:pointer;box-shadow:0 4px 0 #b23062}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #b23062}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c"></canvas>
<div id="title" class="ov show"><h1>アンブレラ</h1><p>タップ / クリックで<br>左右の向きを切りかえ<br>障害物をギリギリでかわそう<br>ゲージが満タンで<br>壁ぶち破りタイム！</p><button id="start">スタート</button></div>
<div id="over" class="ov"><h1>ゲームオーバー</h1><p>スコア</p><div class="big" id="fs">0</div><p id="best"></p><button id="retry">もう一度プレイ</button></div>
</div>
<script>
const W=360,H=640,cv=document.getElementById('c'),ctx=cv.getContext('2d');
let dpr=1;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);dpr=Math.min(devicePixelRatio||1,2);cv.style.width=W*s+'px';cv.style.height=H*s+'px';cv.width=W*s*dpr;cv.height=H*s*dpr;document.querySelectorAll('.ov').forEach(o=>{o.style.width=W*s+'px';o.style.height=H*s+'px'});}
addEventListener('resize',fit);fit();
let best=0;try{best=+localStorage.getItem('umb_best')||0}catch(e){}
// audio
let ac=null;
function snd(f,d,t='sine',v=.12,f2){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.setValueAtTime(f,ac.currentTime);if(f2)o.frequency.exponentialRampToValueAtTime(f2,ac.currentTime+d);g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}
// state
const R=7,BAR=22;
let st='title',p,rows,parts,texts,trail,dist,bonus,gauge,breakT,inv,combo,spawnY,t,shake,hit,flash,overT,streak,bgY=0;
const GMAX=12;
function reset(){p={x:W/2,y:170,dir:1};rows=[];parts=[];texts=[];trail=[];dist=0;bonus=0;gauge=0;breakT=0;inv=0;combo=0;spawnY=380;t=0;shake=0;hit=0;flash=0;streak=0;}
const score=()=>Math.floor(dist/10)+bonus;
function speed(){const sc=score();return Math.min(120*Math.pow(1.1,Math.floor(sc/50)),320);}
function addRow(y){
  if(breakT>0){const b=[];for(let i=0;i<8;i++)b.push(true);rows.push({y,brick:1,b,h:30,hue:Math.random()*360});return;}
  const gw=Math.max(88,70+Math.random()*90-Math.min(dist/200,20));
  const prev=rows.filter(r=>!r.brick).slice(-1)[0];
  let bx=20+Math.random()*(W-40-gw);
  if(prev)bx=Math.max(20,Math.min(W-20-gw,prev.bx+(Math.random()*2-1)*190));
  const mv=dist>1500&&Math.random()<.4;
  rows.push({y,bx,gx:bx,gw,amp:mv?Math.min(45,bx-8,W-8-bx-gw):0,f:1.5+Math.random(),ph:Math.random()*6,min:99,done:0,h:BAR});
}
function burst(x,y,c,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=sp*(.3+Math.random());parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-40,l:.6+Math.random()*.5,m:1.1,c,s:2+Math.random()*4});}}
function say(x,y,s,c,sz){texts.push({x,y,s,c,sz:sz||18,l:.9});}
function startBreak(){
  breakT=5;combo=0;flash=1;shake=14;hit=.08;
  rows.forEach(r=>{if(!r.brick){burst(r.gx+r.gw/2,r.y,'#ff9a5c',10,260);}});
  rows=[];spawnY=H+60;snd(300,.5,'sawtooth',.15,900);snd(600,.4,'square',.08,1400);
  say(W/2,H/2,'BREAK!!','#ffd34d',48);
}
function endBreak(){
  breakT=0;inv=1.5;gauge=0;rows.forEach(r=>{if(r.brick)burst(W/2,r.y,'#fff',6,160)});
  rows=[];spawnY=H+240;snd(500,.3,'triangle',.12,250);
}
function die(){
  st='over';overT=.7;shake=18;hit=.1;flash=1;burst(p.x,p.y,'#ffd34d',34,320);burst(p.x,p.y,'#ff5d73',20,240);
  snd(400,.5,'sawtooth',.16,60);
  const s=score();if(s>best){best=s;try{localStorage.setItem('umb_best',best)}catch(e){}}
}
function circRect(cx,cy,r,x,y,w,h){const nx=Math.max(x,Math.min(cx,x+w)),ny=Math.max(y,Math.min(cy,y+h));return (cx-nx)**2+(cy-ny)**2<r*r;}
function flip(){p.dir*=-1;snd(p.dir>0?880:660,.07,'triangle',.07);}
function update(dt){
  t+=dt;const br=breakT>0;
  const sc=br?340:speed(),vx=br?275:235,scroll=sc*dt;
  if(inv>0)inv-=dt;
  dist+=scroll;bgY=(bgY+scroll*(br?1.6:1))%80;
  p.x+=p.dir*vx*dt;
  if(p.x<R+4){p.x=R+4;p.dir=1;burst(p.x,p.y,'#fff',3,60);}
  if(p.x>W-R-4){p.x=W-R-4;p.dir=-1;burst(p.x,p.y,'#fff',3,60);}
  trail.push({x:p.x,y:p.y});if(trail.length>(br?22:14))trail.shift();
  trail.forEach(q=>q.y-=scroll);
  spawnY-=scroll;
  while(spawnY<H+30){addRow(spawnY);spawnY+=br?64:Math.max(165,215-dist/120);}
  const pr=br?20:R;
  for(const r of rows){
    r.y-=scroll;
    if(r.brick){
      const bw=W/8;
      for(let i=0;i<8;i++){
        if(!r.b[i])continue;
        const cx=i*bw+bw/2;
        if(Math.abs(cx-p.x)<bw/2+pr*.9&&Math.abs(r.y+r.h/2-p.y)<r.h/2+pr*.8){
          r.b[i]=false;combo++;bonus+=10+Math.min(combo,30);
          burst(cx,r.y+r.h/2,`hsl(${r.hue+i*25},90%,60%)`,12,300);
          shake=Math.min(12,5+combo*.15);hit=.03;
          snd(300+Math.min(combo,24)*35,.12,'square',.09,120);
          if(combo%5===0)say(p.x,p.y-30,combo+' COMBO!','#ffd34d',20);
        }
      }
      continue;
    }
    r.gx=r.bx+(r.amp?Math.sin(t*r.f+r.ph)*r.amp:0);
    const over=r.y<p.y+R&&r.y+r.h>p.y-R;
    if(over){
      r.min=Math.min(r.min,Math.min(p.x-r.gx,r.gx+r.gw-p.x)-R);
      if(inv<=0&&!br&&(circRect(p.x,p.y,R,0,r.y,r.gx,r.h)||circRect(p.x,p.y,R,r.gx+r.gw,r.y,W,r.h))){die();return;}
    }
    if(!r.done&&r.y+r.h<p.y-R){
      r.done=1;
      if(!br){
        if(r.min<9){streak++;const b=50+streak*10;bonus+=b;gauge=Math.min(GMAX,gauge+2);
          say(p.x,p.y-24,'ギリギリ！ +'+b,'#ff5d8f',20);burst(p.x,p.y,'#ff5d8f',10,160);shake=4;flash=.25;
          snd(1000+Math.min(streak,8)*80,.14,'triangle',.12,1800);}
        else{streak=0;gauge=Math.min(GMAX,gauge+1);bonus+=5;snd(660,.06,'sine',.06);}
        if(gauge>=GMAX){startBreak();return;}
      }
    }
  }
  rows=rows.filter(r=>r.y>-40);
  if(br){breakT-=dt;gauge=Math.max(0,breakT/5*GMAX);if(breakT<=0)endBreak();}
}
// draw
function draw(){
  ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);
  const br=breakT>0;
  const g=ctx.createLinearGradient(0,0,0,H);
  if(br){g.addColorStop(0,'#3a1450');g.addColorStop(1,'#7a2a3a');}else{g.addColorStop(0,'#141a38');g.addColorStop(1,'#1f2a55');}
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  // speed lines
  ctx.strokeStyle=br?'rgba(255,220,160,.25)':'rgba(255,255,255,.07)';ctx.lineWidth=2;
  for(let i=0;i<10;i++){const x=(i*37+11)%W,y=((i*91-bgY*(1+i%3*.4))%H+H)%H;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+(br?70:30));ctx.stroke();}
  for(const r of rows){
    if(r.brick){
      const bw=W/8;
      for(let i=0;i<8;i++){if(!r.b[i])continue;
        ctx.fillStyle=`hsl(${r.hue+i*25},85%,58%)`;ctx.fillRect(i*bw+1,r.y,bw-2,r.h-2);
        ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(i*bw+1,r.y,bw-2,5);}
      continue;
    }
    const gr=ctx.createLinearGradient(0,r.y,0,r.y+r.h);gr.addColorStop(0,'#ff7a8c');gr.addColorStop(1,'#d63a58');
    ctx.fillStyle=gr;ctx.fillRect(0,r.y,r.gx,r.h);ctx.fillRect(r.gx+r.gw,r.y,W-r.gx-r.gw,r.h);
    ctx.fillStyle='#fff';ctx.fillRect(r.gx-3,r.y,3,r.h);ctx.fillRect(r.gx+r.gw,r.y,3,r.h);
  }
  // trail
  trail.forEach((q,i)=>{ctx.fillStyle=br?`rgba(255,180,90,${i/trail.length*.5})`:`rgba(255,255,255,${i/trail.length*.25})`;ctx.beginPath();ctx.arc(q.x,q.y,(br?14:5)*i/trail.length+2,0,6.28);ctx.fill();});
  // player (open umbrella)
  if(st==='play'&&!(inv>0&&Math.floor(t*14)%2)){
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.dir*.35);
    if(br){const gl=ctx.createRadialGradient(0,0,4,0,0,34);gl.addColorStop(0,'rgba(255,200,80,.8)');gl.addColorStop(1,'rgba(255,200,80,0)');ctx.fillStyle=gl;ctx.beginPath();ctx.arc(0,0,34,0,6.28);ctx.fill();ctx.scale(1.7,1.7);}
    ctx.strokeStyle='#e8e8f0';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-2);ctx.lineTo(0,12);ctx.quadraticCurveTo(0,16,-4,15);ctx.stroke();
    ctx.fillStyle='#ffd34d';ctx.beginPath();ctx.moveTo(-12,0);ctx.quadraticCurveTo(0,-20,12,0);ctx.quadraticCurveTo(6,-3,0,0);ctx.quadraticCurveTo(-6,-3,-12,0);ctx.fill();
    ctx.fillStyle='#ff5d8f';ctx.beginPath();ctx.moveTo(-4,-9);ctx.quadraticCurveTo(0,-14,4,-9);ctx.quadraticCurveTo(2,-3,0,0);ctx.quadraticCurveTo(-2,-3,-4,-9);ctx.fill();
    ctx.restore();
  }
  for(const q of parts){ctx.globalAlpha=Math.max(0,q.l/q.m);ctx.fillStyle=q.c;ctx.fillRect(q.x-q.s/2,q.y-q.s/2,q.s,q.s);}
  ctx.globalAlpha=1;
  ctx.textAlign='center';ctx.font='700 20px sans-serif';
  for(const x of texts){ctx.globalAlpha=Math.min(1,x.l*2);ctx.font=`700 ${x.sz}px sans-serif`;ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,.6)';ctx.strokeText(x.s,x.x,x.y);ctx.fillStyle=x.c;ctx.fillText(x.s,x.x,x.y);}
  ctx.globalAlpha=1;ctx.restore();
  if(flash>0){ctx.fillStyle=`rgba(255,255,255,${flash*.5})`;ctx.fillRect(0,0,W,H);}
  // HUD
  if(st!=='title'){
    ctx.textAlign='center';ctx.font='700 38px sans-serif';ctx.lineWidth=5;ctx.strokeStyle='rgba(0,0,0,.6)';
    const s=String(score());ctx.strokeText(s,W/2,48);ctx.fillStyle='#fff';ctx.fillText(s,W/2,48);
    ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(40,62,W-80,10);
    ctx.fillStyle=br?'#ffd34d':(gauge>=GMAX-2?'#ff5d8f':'#6fe3ff');ctx.fillRect(40,62,(W-80)*gauge/GMAX,10);
    ctx.font='700 11px sans-serif';ctx.fillStyle='#fff';ctx.fillText(br?'BREAK TIME':'GAUGE',W/2,90);
    if(br&&combo>1){ctx.font='700 26px sans-serif';ctx.fillStyle='#ffd34d';ctx.strokeText(combo+' COMBO',W/2,130);ctx.fillText(combo+' COMBO',W/2,130);}
  }
}
let last=0;
function loop(ts){
  const dt=Math.min((ts-last)/1000,.033)||0;last=ts;
  if(hit>0){hit-=dt;}
  else{
    if(st==='play')update(dt);
    if(st==='over'&&overT>0){overT-=dt;if(overT<=0){document.getElementById('fs').textContent=score();document.getElementById('best').textContent='ベスト '+best;document.getElementById('over').classList.add('show');}}
    for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=500*dt;q.l-=dt;}
    parts=parts.filter(q=>q.l>0);
    for(const x of texts){x.y-=30*dt;x.l-=dt;}
    texts=texts.filter(x=>x.l>0);
    shake=Math.max(0,shake-60*dt);flash=Math.max(0,flash-3*dt);
  }
  draw();requestAnimationFrame(loop);
}
function begin(){reset();st='play';document.querySelectorAll('.ov').forEach(o=>o.classList.remove('show'));snd(700,.15,'triangle',.1,1000);}
document.getElementById('start').onclick=begin;
document.getElementById('retry').onclick=begin;
cv.addEventListener('pointerdown',e=>{e.preventDefault();if(st==='play')flip();});
addEventListener('keydown',e=>{if(e.code==='Space'&&st==='play'){e.preventDefault();flip();}});
reset();requestAnimationFrame(loop);
</script>
</body>
</html>
